<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bestie ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background: linear-gradient(135deg,#ff9a9e,#fad0c4);
    min-height:100vh;
    text-align:center;
    overflow-x:hidden;
}

.container{
    padding:40px 20px;
}

h1{
    color:white;
    font-size:3rem;
    margin-bottom:15px;
    animation: glow 2s infinite alternate;
}

p{
    color:white;
    font-size:1.2rem;
    margin-bottom:30px;
}

.gallery{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
}

.gallery img{
    width:250px;
    height:250px;
    object-fit:cover;
    border-radius:20px;
    box-shadow:0 0 20px rgba(255,255,255,0.6);
    transition:0.4s;
}

.gallery img:hover{
    transform:scale(1.1);
}

@keyframes glow{
    from{
        text-shadow:0 0 10px white;
    }
    to{
        text-shadow:0 0 30px white,0 0 50px pink;
    }
}

.heart{
    position:fixed;
    color:red;
    font-size:25px;
    animation: float 5s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
        opacity:1;
    }
    to{
        transform:translateY(-100px);
        opacity:0;
    }
}

button{
    margin-top:30px;
    padding:15px 30px;
    border:none;
    border-radius:30px;
    background:white;
    color:#ff4f81;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.1);
}

.message{
    margin-top:20px;
    color:white;
    font-size:24px;
    display:none;
}
</style>
</head>

<body>

<div class="container">
    <h1>❤️ My Everything ❤️</h1>
    <p>Thank you for always being there for me!</p>

    <div class="gallery">
        <img src="photo1.jpg">
        <img src="photo2.jpg">
        <img src="photo3.jpg">
        <img src="photo4.jpg">
    </div>

    <button onclick="showMessage()">Click Me ✨</button>

    <div class="message" id="msg">
        You are the best person I have ever met. There is no one else like you in my heart. I am sure of that. I love you always. ❤️
    </div>
</div>

<script>
function showMessage(){
    document.getElementById("msg").style.display="block";
}

function createHeart(){
    const heart=document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML="❤️";

    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(20+Math.random()*30)+"px";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },5000);
}

setInterval(createHeart,300);
</script>

</body>
</html>
